name: Sky Petal checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_DIR: /tmp/sky-petal-acceptance-ci
      TEST_OWNER_ACCESS_FILE: /tmp/sky-petal-acceptance-owner.json
      TEST_COMMERCE_FIXTURES: "true"
      ALLOW_LOCAL_AUTH: "true"
      DEPLOYMENT_ENV: staging
      SITE_INDEXING_ENABLED: "false"
      QA_EVIDENCE_DIR: qa/evidence/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx qa/domain-probes.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/prepare-acceptance.ts
      - name: Run local HTTP and browser checks
        run: |
          npm run start > /tmp/sky-petal.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4317/api/me && break || sleep 2; done
          npm run test:api
          npm run test:browser
        env:
          TEST_BASE_URL: http://127.0.0.1:4317
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-petal-check-results
          path: |
            playwright-report/
            artifacts/
            qa/evidence/ci/
